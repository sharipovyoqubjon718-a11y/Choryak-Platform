<!DOCTYPE html>
<html lang="tg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choryak Platform</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b132b;
            color: #ffffff;
            overflow-x: hidden;
        }

        /* Сохтори асосӣ */
        .app-container {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        /* Сайдбар */
        .sidebar {
            width: 260px;
            background-color: #1c2541;
            border-right: 1px solid #3a506b;
            display: flex;
            flex-direction: column;
            padding: 20px 15px;
            gap: 15px;
            transition: transform 0.3s ease;
            z-index: 1000;
        }

        .sidebar-logo {
            font-size: 20px;
            font-weight: bold;
            color: #4cc9f0;
            margin-bottom: 20px;
        }

        .nav-item {
            padding: 12px 15px;
            border-radius: 8px;
            background-color: transparent;
            color: #adb5bd;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-item:hover, .nav-item.active {
            background-color: #3a506b;
            color: #ffffff;
        }

        /* Қисми асосии мундариҷа */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
            background-color: #0b132b;
        }

        /* Тугмаи меню барои телефон (дар компютер хомӯш аст) */
        .menu-toggle {
            display: none;
            background: #4cc9f0;
            color: #0b132b;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 15px;
            align-self: flex-start;
        }

        /* Блоки интихобҳо (Синф, Чоряк, Фан) */
        .selectors-wrapper {
            background-color: #1c2541;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #3a506b;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 10px;
        }

        .selectors-title {
            font-size: 18px;
            font-weight: bold;
            color: #f72585;
        }

        .selectors-row {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .select-group {
            flex: 1;
            min-width: 120px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .select-group label {
            font-size: 14px;
            color: #adb5bd;
        }

        .select-group select {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #3a506b;
            background-color: #0b132b;
            color: #ffffff;
            font-size: 14px;
            outline: none;
        }

        /* Майдони барориши саволҳо */
        .questions-container {
            margin-top: 20px;
            background-color: #1c2541;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #3a506b;
            flex: 1;
        }

        /* Тарҳрезӣ барои телефонҳо (Responsive Media Query) */
        @media screen and (max-width: 768px) {
            .app-container {
                flex-direction: column;
            }

            /* Сайдбар дар телефон дар аввал пинҳон мешавад */
            .sidebar {
                position: fixed;
                left: -260px;
                top: 0;
                bottom: 0;
                width: 260px;
                box-shadow: 5px 0 15px rgba(0,0,0,0.5);
            }

            /* Ҳангоми кушода шудан сайдбар мебарояд */
            .sidebar.open {
                left: 0;
            }

            .menu-toggle {
                display: block;
            }

            .main-content {
                padding: 10px;
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Сайдбар -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-logo">Choryak Platform</div>
            <div class="nav-item active">🏠 Асосӣ</div>
            <div class="nav-item">📚 Синфҳо</div>
            <div class="nav-item">📊 Натиҷаҳо</div>
            <div class="nav-item">⚙️ Танзимот</div>
        </div>

        <!-- Қисми асосӣ -->
        <div class="main-content">
            <!-- Тугмаи кушодани меню дар телефон -->
            <button class="menu-toggle" id="menuToggle">☰ Меню</button>

            <!-- Блоки интихоби синфу чоряк ва фан -->
            <div class="selectors-wrapper">
                <div class="selectors-title">Интихоби Синфу Чоряк ва Фанҳо</div>
                <p style="font-size: 13px; color: #adb5bd;">Барои дидани тестҳо майдонҳои зеринро пур кунед.</p>
                
                <div class="selectors-row">
                    <div class="select-group">
                        <label>Рақами Синф</label>
                        <select id="classSelect">
                            <option value="">Интихоб...</option>
                            <option value="5">Синфи 5</option>
                            <option value="6">Синфи 6</option>
                            <option value="7">Синфи 7</option>
                            <option value="8">Синфи 8</option>
                            <option value="9">Синфи 9</option>
                            <option value="10">Синфи 10</option>
                            <option value="11">Синфи 11</option>
                        </select>
                    </div>

                    <div class="select-group">
                        <label>Чоряк</label>
                        <select id="quarterSelect">
                            <option value="">Чоряк...</option>
                            <option value="1">Чоряки 1</option>
                            <option value="2">Чоряки 2</option>
                            <option value="3">Чоряки 3</option>
                            <option value="4">Чоряки 4</option>
                        </select>
                    </div>

                    <div class="select-group">
                        <label>Номи Фан</label>
                        <select id="subjectSelect">
                            <option value="">Фан...</option>
                            <option value="math">Математика</option>
                            <option value="physics">Физика</option>
                            <option value="informatics">Информатика</option>
                            <option value="literature">Адабиёт</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Ҷои барориши саволҳо ва тестҳо -->
            <div class="questions-container" id="questionsContainer">
                <p style="color: #adb5bd; text-align: center; margin-top: 20px;">Лутфан синф, чоряк ва фанро интихоб кунед то тестҳо пайдо шаванд.</p>
            </div>
        </div>
    </div>

    <script>
        // Логикаи кушода ва пӯшида кардани сайдбар бо тугма дар телефон
        const menuToggle = document.getElementById('menuToggle');
        const sidebar = document.getElementById('sidebar');

        menuToggle.addEventListener('click', () => {
            sidebar.classList.toggle('open');
        });

        // Пӯшидани сайдбар ҳангоми пахш кардани берун аз он дар телефон
        document.addEventListener('click', (event) => {
            if (window.innerWidth <= 768) {
                if (!sidebar.contains(event.target) && event.target !== menuToggle) {
                    sidebar.classList.remove('open');
                }
            }
        });
    </script>
</body>
</html>
